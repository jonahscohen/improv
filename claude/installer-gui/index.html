<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improv &mdash; Setup</title>
<style>
  /* ==========================================================================
     TOKENS - lifted verbatim from the marketing site (improv-site/styles.css).
     Jonah, 2026-08-01: "lift the tokens specifically, nothing else". So the
     values below are copied, not reinterpreted, and nothing here invents a new
     brand colour. The two ADDITIONS are called out where they appear: the
     installer has to express install STATE, and the marketing palette has no
     semantic status colours because a marketing page never needed them.
     ========================================================================== */
  :root{
    color-scheme:light;
    /* colors.brand */
    --color-red:#DC2618;
    --color-ink:#02272B;
    --color-cream:#F4EFE4;
    --color-paper:#FAF7EE;

    /* colors.text */
    --text-primary:#02272B;
    --text-secondary:#54564F;
    --text-tertiary:#8B8A82;
    --text-inverse:#F4EFE4;

    /* colors.surface */
    --surface-canvas:#F4EFE4;
    --surface-raised:#FAF7EE;
    --surface-inverse:#02272B;
    --surface-alt:#ECE5D4;

    /* colors.border */
    --border-soft:rgba(2,39,43,0.08);
    --border-firm:rgba(2,39,43,0.16);
    --border-inverse:rgba(244,239,228,0.12);

    /* colors.accent */
    --accent-red-subtle:rgba(220,38,24,0.08);
    --accent-red-border:rgba(220,38,24,0.24);

    /* typography */
    --font-display:'MADE Awelier','Iowan Old Style',Charter,Cambria,Georgia,serif;
    --font-body:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

    --size-xs:0.78rem; --size-sm:0.88rem; --size-base:1rem;
    --size-lg:1.18rem; --size-xl:1.5rem;
    --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;

    /* rounded */
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-full:9999px;

    /* spacing - 4pt grid */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;

    /* elevation */
    --shadow-sm:0 1px 2px rgba(2,39,43,0.04),0 1px 1px rgba(2,39,43,0.06);
    --shadow-md:0 2px 8px rgba(2,39,43,0.06),0 1px 2px rgba(2,39,43,0.08);
    --shadow-lg:0 8px 24px rgba(2,39,43,0.08),0 2px 6px rgba(2,39,43,0.06);

    /* motion */
    --ease-out:cubic-bezier(0.2,0,0,1);
    --duration-instant:100ms; --duration-fast:180ms;

    /* ---- ADDITION 1: semantic status ------------------------------------
       Install state is the whole subject of this screen and the marketing
       palette has no status colours. These are derived to live in the same
       world rather than pulled from a generic UI kit: the green carries the
       ink's green undertone, the ochre sits with the cream. Kept deliberately
       distinct from --color-red, which stays reserved for the brand mark and
       for destructive intent, so "installed" can never read as "danger". */
    --status-active:#1F6F4A;
    --status-active-bg:rgba(31,111,74,0.10);
    --status-partial:#9A6B12;
    --status-partial-bg:rgba(154,107,18,0.10);
    --status-none:var(--text-tertiary);
    --status-none-bg:rgba(2,39,43,0.05);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-canvas:#02272B; --surface-raised:#0A3036; --surface-alt:#073035;
    --surface-inverse:#F4EFE4;
    --text-primary:#F4EFE4; --text-secondary:rgba(244,239,228,0.72);
    --text-tertiary:rgba(244,239,228,0.52); --text-inverse:#02272B;
    --border-soft:rgba(244,239,228,0.10); --border-firm:rgba(244,239,228,0.20);
    --status-active:#6FC79B; --status-active-bg:rgba(111,199,155,0.14);
    --status-partial:#D9A94E; --status-partial-bg:rgba(217,169,78,0.14);
    --status-none-bg:rgba(244,239,228,0.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --surface-canvas:#02272B; --surface-raised:#0A3036; --surface-alt:#073035;
      --surface-inverse:#F4EFE4;
      --text-primary:#F4EFE4; --text-secondary:rgba(244,239,228,0.72);
      --text-tertiary:rgba(244,239,228,0.52); --text-inverse:#02272B;
      --border-soft:rgba(244,239,228,0.10); --border-firm:rgba(244,239,228,0.20);
      --status-active:#6FC79B; --status-active-bg:rgba(111,199,155,0.14);
      --status-partial:#D9A94E; --status-partial-bg:rgba(217,169,78,0.14);
      --status-none-bg:rgba(244,239,228,0.07);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--surface-canvas); color:var(--text-primary);
    font-family:var(--font-body); font-size:var(--size-base); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:var(--space-6);
  }

  /* ---- the shell -------------------------------------------------------
     Was a fake terminal window with traffic-light dots. Those read as a
     screenshot of a tool rather than the tool, which is the opposite of the
     "sturdy" ask - so the chrome is now a real application panel: a raised
     paper plane on the cream canvas, with a firm border that holds its edges. */
  .win{
    width:100%; max-width:940px; background:var(--surface-raised);
    border:1px solid var(--border-firm); border-radius:var(--radius-lg);
    overflow:hidden; box-shadow:var(--shadow-lg);
    display:flex; flex-direction:column; max-height:calc(100vh - var(--space-10));
  }

  /* ---- header: WAYFINDING LAYER 1, "what am I in" ---------------------- */
  .titlebar{
    background:var(--surface-alt); border-bottom:1px solid var(--border-firm);
    padding:var(--space-3) var(--space-5);
    display:flex; align-items:baseline; gap:var(--space-3); flex-wrap:wrap;
  }
  .wordmark{
    font-family:var(--font-display); font-size:var(--size-lg);
    font-weight:var(--weight-regular); color:var(--text-primary);
    letter-spacing:-.01em; line-height:1;
  }
  .wordmark .amp{color:var(--color-red);}   /* the one place red is spent */
  .titletext{
    font-family:var(--font-mono); font-size:var(--size-xs);
    color:var(--text-tertiary); letter-spacing:.02em;
  }
  .titletext .path{color:var(--text-secondary);}
  /* The old traffic-light dots are gone; the rule keeps any stray markup from
     re-introducing them if this file is ever partially reverted. */
  .dot{display:none;}

  /* ---- body ------------------------------------------------------------- */
  .screen{padding:var(--space-5) var(--space-5) var(--space-3); overflow-y:auto; flex:1 1 auto;}

  /* ---- WAYFINDING LAYER 2: the trail --------------------------------------
     A breadcrumb only helps if it reads as a PATH. The separators are now
     spaced and tinted, and the final segment is the one that carries weight,
     so "where am I" is answerable at a glance instead of by reading. */
  .crumb{
    font-family:var(--font-mono); font-size:var(--size-xs);
    color:var(--text-tertiary); margin-bottom:var(--space-2);
    display:flex; align-items:center; gap:var(--space-1); flex-wrap:wrap;
  }
  .crumb b{
    color:var(--text-primary); font-weight:var(--weight-medium);
    background:var(--surface-alt); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:1px var(--space-2);
  }
  .lead{
    color:var(--text-secondary); font-size:var(--size-sm);
    margin:0 0 var(--space-4); max-width:70ch;
    text-wrap:balance; overflow-wrap:anywhere;
  }
  .lead .meta{
    font-family:var(--font-mono); font-size:var(--size-xs);
    color:var(--text-tertiary); white-space:nowrap;
  }

  /* ---- WAYFINDING LAYER 3: section landmarks ---------------------------
     Was a dim letterspaced string floating over the rows. Now it is a real
     landmark with a rule running off it, so the two groups read as separate
     places rather than one long list. */
  .seclabel{
    display:flex; align-items:center; gap:var(--space-3);
    font-family:var(--font-mono); font-size:var(--size-xs);
    letter-spacing:.12em; color:var(--text-tertiary);
    margin:var(--space-5) 0 var(--space-2);
  }
  .seclabel:first-child{margin-top:0;}
  .seclabel::after{content:""; flex:1 1 auto; height:1px; background:var(--border-soft);}

  /* ---- rows: the sturdiness ---------------------------------------------
     Was flex with ch-width columns and white-space:pre, so columns drifted
     whenever a name ran long. A grid makes the columns actually line up down
     the whole list, which is most of what "sturdy" means on a screen like this. */
  .rows{display:flex; flex-direction:column; gap:1px;}
  .row{
    display:grid;
    /* The description column gets the slack. Fixed columns to its right used to
       crush it to "rules, settin..." on a 940px panel, which loses the one piece
       of text that explains what the component IS. stat/count/pend now size to
       their content instead of reserving space they rarely use. */
    grid-template-columns:1.4rem 1.4rem minmax(8rem,13rem) minmax(0,1fr) auto 3.5rem auto;
    align-items:center; gap:var(--space-2);
    padding:var(--space-2) var(--space-3);
    border:1px solid transparent; border-radius:var(--radius-md);
    cursor:pointer; user-select:none;
    transition-property:background,border-color,scale;
    transition-duration:var(--duration-instant);
    transition-timing-function:var(--ease-out);
  }
  .row:hover{background:var(--surface-alt);}
  /* A row is a control: it is clicked, and the arrow keys drive it. It had
     default/hover/selected and nothing for the press, so a click produced no
     physical confirmation at all. */
  .row:active{scale:0.994; background:var(--surface-alt); border-color:var(--border-firm);}
  .row:focus-visible{outline:2px solid var(--color-red); outline-offset:-1px;}
  .row[aria-disabled="true"],.row.is-disabled{cursor:default;}
  .row.sel{
    background:var(--surface-alt); border-color:var(--accent-red-border);
    box-shadow:inset 3px 0 0 var(--color-red);   /* the selected marker */
  }
  .row .caret{color:var(--text-tertiary); font-size:var(--size-xs); text-align:center;}
  .row .glyph{text-align:center; font-size:var(--size-sm);}
  .row .name{
    font-family:var(--font-mono); font-size:var(--size-sm);
    color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row.feat .name{font-weight:var(--weight-semibold);}
  .row.folder .name,.row.hook .name{color:var(--text-secondary);}
  .row .tag{
    font-size:var(--size-xs); color:var(--text-tertiary);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ---- WAYFINDING LAYER 4: state as a shape, not just a colour ----------
     The status was a coloured word, so it depended on hue alone. It is now a
     pill: a shape difference readable before the colour is, which also keeps
     it legible for anyone who does not separate the green from the ochre. */
  .row .stat{
    justify-self:start;
    font-family:var(--font-mono); font-size:var(--size-xs); letter-spacing:.02em;
    padding:2px var(--space-2); border-radius:var(--radius-full);
    white-space:nowrap; color:var(--status-none); background:var(--status-none-bg);
  }
  .row .count{
    font-family:var(--font-mono); font-size:var(--size-xs);
    color:var(--text-tertiary); text-align:right; font-variant-numeric:tabular-nums;
  }
  .row .pend{
    font-family:var(--font-mono); font-size:var(--size-xs);
    text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; min-width:1rem;
  }

  /* Status colours reach the pill through the glyph class the JS already sets,
     so no JS change is needed to colour the row's state. */
  .g-active{color:var(--status-active);}
  .g-partial{color:var(--status-partial);}
  .g-none{color:var(--text-tertiary);}
  .row:has(.g-active) .stat{color:var(--status-active); background:var(--status-active-bg);}
  .row:has(.g-partial) .stat{color:var(--status-partial); background:var(--status-partial-bg);}

  .action .name{color:var(--text-primary); font-family:var(--font-body); font-weight:var(--weight-medium);}
  /* Apply / Quit / Back / Install-all are buttons, so they take the standard
     press: scale 0.96 with an ease-out. A full-width ITEM row keeps the subtle
     0.994 above - 0.96 across 900px is 36px of travel and reads as a glitch,
     which is the rule's geometry not holding rather than the rule being wrong. */
  .action{transition-property:background,border-color,scale; transition-duration:150ms; transition-timing-function:ease-out;}
  .action:active{scale:0.96;}
  .action{grid-template-columns:1.4rem 1.4rem 1fr;}
  .danger .name{color:var(--color-red);}
  .sep{height:1px; background:var(--border-soft); margin:var(--space-3) var(--space-1);}
  .plus{color:var(--status-active);}
  .minus{color:var(--color-red);}

  /* ---- detail: the standing explanation --------------------------------- */
  .detail{
    overflow-wrap:anywhere;
    border-top:1px solid var(--border-soft);
    padding:var(--space-3) var(--space-5);
    color:var(--text-secondary); font-size:var(--size-sm);
    min-height:2.75rem; background:var(--surface-alt); flex:0 0 auto;
  }
  .detail b{
    font-family:var(--font-mono); color:var(--text-primary);
    font-weight:var(--weight-medium);
  }

  #log{
    margin:0; padding:var(--space-4) var(--space-5); max-height:180px; overflow:auto;
    background:var(--surface-inverse); color:var(--text-inverse);
    font-family:var(--font-mono); font-size:var(--size-xs); line-height:1.6;
    white-space:pre-wrap; border-top:1px solid var(--border-firm); flex:0 0 auto;
  }

  /* ---- footer: the keyboard contract ------------------------------------ */
  .footer{
    border-top:1px solid var(--border-firm);
    padding:var(--space-3) var(--space-5);
    background:var(--surface-alt); color:var(--text-tertiary); font-size:var(--size-xs);
    display:flex; justify-content:space-between; align-items:center;
    gap:var(--space-4); flex-wrap:wrap; flex:0 0 auto;
  }
  .footer .keys{display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap;}
  /* Keys were plain coloured text, indistinguishable from the labels beside
     them. As chips they read as things you PRESS. */
  .footer .keys span{
    font-family:var(--font-mono); font-size:0.72rem; color:var(--text-secondary);
    background:var(--surface-raised); border:1px solid var(--border-firm);
    border-bottom-width:2px; border-radius:var(--radius-sm);
    padding:1px var(--space-2); white-space:nowrap;
  }
  #pendfoot{
    font-family:var(--font-mono); color:var(--text-secondary); white-space:nowrap;
  }

  :focus-visible{outline:2px solid var(--color-red); outline-offset:2px; border-radius:var(--radius-sm);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}
  @media (max-width:720px){
    .row{grid-template-columns:1.4rem 1.4rem minmax(8rem,auto) 1fr; }
    .row .tag,.row .count{display:none;}
  }
</style>
</head>
<body>
  <div class="win" role="application" aria-label="Improv installer">
    <div class="titlebar">
      <span class="wordmark">Improv<span class="amp">&amp;</span></span>
      <span class="titletext">You are here: <span class="path" id="titlepath">setup</span></span>
    </div>
    <div class="screen">
      <div class="crumb" id="crumb"></div>
      <div class="lead" id="lead"></div>
      <div class="rows" id="rows"></div>
    </div>
    <pre id="log" style="display:none"></pre>
    <div class="detail" id="detail"></div>
    <div class="footer">
      <span class="keys"><span>&#8593;&#8595;</span> move <span>&#8594;</span> open <span>enter</span> toggle <span>&#8592;</span> back <span>a</span> apply <span>q</span> quit</span>
      <span id="pendfoot"></span>
    </div>
  </div>

<script>
// ---- server API (token-scoped; every request carries the page nonce) ----
const TOKEN = new URLSearchParams(location.search).get('token') || '';
function api(path, opts) {
  const u = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  return fetch(u, opts || {});
}

// ---- tree + install state, populated from the live manifest ----
let T = {};
const installed = {}, pending = {};

// Walk a bucket's members into the node shape the nav/render code consumes:
//  - leaf   -> {tag,desc}                       (no children => isLeaf)
//  - hooks  -> {folder,hooks,tag,desc,children} (each hook name is a leaf)
//  - nested -> {tag,desc,children}              (recurse into its members)
function walkMembers(members, out) {
  for (const mem of members) {
    if (mem.kind === 'leaf') {
      out[mem.key] = { tag: mem.tag || '', desc: mem.desc || '' };
    } else if (mem.kind === 'hooks') {
      const kids = {};
      for (const h of (mem.hooks || [])) kids[h] = { tag: '', desc: '' };
      out[mem.key] = { folder: 1, hooks: 1, tag: mem.tag || '', desc: mem.desc || '', children: kids };
    } else if (mem.members) {
      const kids = {};
      walkMembers(mem.members, kids);
      out[mem.key] = { tag: mem.tag || '', desc: mem.desc || '', children: kids };
    }
  }
}
function buildTreeFromManifest(m) {
  const tree = {};
  for (const b of m.buckets) {
    // A bucket with no members is itself a leaf (e.g. tilt-lab, lotus) so its
    // single state key stays reachable via leafPaths - do NOT give it children.
    const node = { tag: b.tag || '', desc: b.desc || '', featured: (b.section === 'core') };
    if (b.members && b.members.length) {
      node.children = {};
      walkMembers(b.members, node.children);
    }
    tree[b.key] = node;
  }
  T = tree;
  // Install state comes straight from the manifest, keyed by leaf path.
  for (const k of Object.keys(installed)) delete installed[k];
  for (const [path, st] of Object.entries(m.state)) installed[path] = (st === 'active');
}

async function boot() {
  try {
    const m = await api('/manifest').then(r => r.json());
    buildTreeFromManifest(m);
    render();
  } catch (e) {
    document.getElementById('lead').textContent = 'Could not load the installer manifest: ' + e;
  }
}

// ---- tree helpers ----
function nodeAt(path){ let n={children:T}; for(const s of path) n=n.children[s]; return n; }
function isLeaf(n){ return !n.children; }
function leafPaths(path){ const n=nodeAt(path); if(isLeaf(n)) return [path.join('/')];
  return Object.keys(n.children).flatMap(k=>leafPaths(path.concat(k))); }

// ---- state ----
const GLYPH={active:'●',partial:'◐',none:'○'}, CLS={active:'g-active',partial:'g-partial',none:'g-none'};
const LABEL={active:'installed',partial:'partial',none:'not installed'};
function counts(path){ const L=leafPaths(path); return {on:L.filter(p=>installed[p]).length,total:L.length}; }
function stateOf(path){ const n=nodeAt(path); if(isLeaf(n)) return installed[path.join('/')]?'active':'none';
  const c=counts(path); return c.on===0?'none':(c.on===c.total?'active':'partial'); }
function leafPending(p){ return pending[p]||null; }
function toggleLeaf(p){ const t=installed[p]?'uninstall':'install'; if(pending[p]===t) delete pending[p]; else pending[p]=t; }
function stageAll(path,a){ leafPaths(path).forEach(p=>{ const want=a==='install'; if(installed[p]===want) delete pending[p]; else pending[p]=a; }); }
function pendUnder(path){ const L=leafPaths(path); return {ins:L.filter(p=>pending[p]==='install').length, un:L.filter(p=>pending[p]==='uninstall').length}; }
function pendingCount(){ return Object.keys(pending).length; }

// ---- apply: stream the real install log, then refresh state from the server ----
function stagedPlan() {
  const install = [], uninstall = [];
  for (const [p, a] of Object.entries(pending)) (a === 'install' ? install : uninstall).push(p);
  return { install, uninstall };
}
let applying = false;
async function runApply() {
  if (applying) return;                                     // guard: never fire /apply twice concurrently
  if (pendingCount() === 0) { toast('Nothing staged to apply.'); return; }
  applying = true;
  const plan = stagedPlan();                                // snapshot the exact plan we post
  const log = document.getElementById('log');
  log.style.display = 'block'; log.textContent = 'Applying...\n';
  let out = '';                                             // capture the stream to read its exit code
  try {
    const res = await api('/apply', { method:'POST', body: JSON.stringify(plan) });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    for (;;) { const { value, done } = await reader.read(); if (done) break; const c = dec.decode(value, { stream:true }); out += c; log.textContent += c; log.scrollTop = log.scrollHeight; }
    const tail = dec.decode(); out += tail; log.textContent += tail; log.scrollTop = log.scrollHeight;   // flush trailing multibyte bytes
    const m = await api('/manifest').then(r => r.json());    // refresh REAL state either way
    buildTreeFromManifest(m);
    // Only treat the apply as done - and clear the staged plan - if the installer
    // exited 0. apply_pending is fail-loud (a rejected/pinned/failed plan ends non-zero),
    // and clearing pending regardless would silently drop the user's staged changes.
    const ok = res.ok && /\[exit 0\]\s*$/.test(out);
    render();
    if (ok) {
      for (const p of plan.install.concat(plan.uninstall)) delete pending[p];   // clear only a clean apply
      render();
    } else {
      toast('Apply did not complete - your staged changes were kept. See the log above.');
    }
  } catch (e) {
    log.textContent += '\n[error] ' + e + '\n';
    toast('Apply failed - your staged changes were kept.');
  } finally {
    applying = false;
  }
}
function doQuit() {
  api('/shutdown', { method:'POST', body:'{}' }).catch(()=>{});
  render(); toast('Installer stopped. You can close this tab.');
}

// ---- dom ----
function mk(tag,cls,text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function pendNodes(ins,un){ const a=[]; if(ins)a.push(mk('span','plus','+'+ins)); if(un){ if(a.length)a.push(document.createTextNode(' ')); a.push(mk('span','minus','−'+un)); } return a; }

// ---- navigation ----
let nav=[], sel=0;
function inHooks(){ return nav.length && nodeAt(nav).hooks; }
function buildRows(){
  const rows=[];
  if(nav.length===0){
    rows.push({type:'label',name:'CORE COMPONENTS'});
    for(const k of Object.keys(T)) if(T[k].featured) rows.push(itemRow([k]));
    rows.push({type:'label',name:'MORE COMPONENTS'});
    for(const k of Object.keys(T)) if(!T[k].featured) rows.push(itemRow([k]));
    rows.push({type:'sep'});
    const n=pendingCount();
    rows.push({type:'apply',name:'Apply '+n+' change'+(n===1?'':'s'),disabled:n===0,hint:n?('Install and remove the '+n+' staged item'+(n===1?'':'s')+' now'):'Nothing staged yet - toggle items to stage changes'});
    rows.push({type:'quit',name:'Quit',hint:'Leave the installer'});
  } else {
    const parent = nav.length===1 ? 'all groups' : nav[nav.length-2];
    const here=nav[nav.length-1];
    const hooksLabel = here==='Hooks' ? 'all hooks' : 'all '+here+' hooks';
    rows.push({type:'back',name:'‹ Back to '+parent,hint:'Go up one level'});
    rows.push({type:'installall',name:(inHooks()?'+ Enable '+hooksLabel+'…':'+ Install all of '+here+'…'),hint:'Stage every item here for install'});
    rows.push({type:'uninstallall',name:(inHooks()?'− Disable '+hooksLabel+'…':'− Remove all of '+here+'…'),hint:'Stage every item here for removal'});
    rows.push({type:'sep'});
    for(const k of Object.keys(nodeAt(nav).children)) rows.push(itemRow(nav.concat(k)));
  }
  return rows;
}
function itemRow(path){
  const key=path[path.length-1], node=nodeAt(path), st=stateOf(path);
  const parentHooks = path.length>1 && nodeAt(path.slice(0,-1)).hooks;
  const row={type:'item', path, name:key, tag:node.tag||'', st, feat:!!node.featured, hook:parentHooks && isLeaf(node), folder:!!node.folder, drill:!isLeaf(node)};
  if(isLeaf(node)){ const p=leafPending(path.join('/')); row.pend = p?[p==='install'?mk('span','plus','+ install'):mk('span','minus','− uninstall')]:[]; }
  else { const c=counts(path); row.count=c.on+'/'+c.total; const {ins,un}=pendUnder(path); row.pend=pendNodes(ins,un); }
  row.hint = node.desc || node.tag || '';
  return row;
}

// ---- render ----
let rowsCache=[];
function selectable(){ return rowsCache.map((r,i)=>(r.type!=='sep'&&r.type!=='label')?i:-1).filter(i=>i>=0); }
function render(){
  const crumb=document.getElementById('crumb'); crumb.textContent='';
  crumb.appendChild(mk('span',null,'Setup'));
  nav.forEach((seg,i)=>{ crumb.appendChild(document.createTextNode('›')); crumb.appendChild(i===nav.length-1?mk('b',null,seg):mk('span',null,seg)); });
  const lead=document.getElementById('lead'); lead.textContent='';
  if(nav.length===0){ lead.appendChild(document.createTextNode('Choose what runs on this machine. Open a group, toggle items to stage changes, then apply.')); document.getElementById('titlepath').textContent='setup'; }
  else { const n=nodeAt(nav), c=counts(nav);
    lead.appendChild(document.createTextNode((n.desc||n.tag||'')+'  '));
    lead.appendChild(mk('span','meta', c.on+' of '+c.total+(n.hooks?' hooks on':' installed')));
    document.getElementById('titlepath').textContent=nav.join(' › '); }

  rowsCache=buildRows();
  const sels=selectable(); if(!sels.includes(sel)) sel=sels[0];
  const host=document.getElementById('rows'); host.textContent='';
  rowsCache.forEach((r,i)=>{
    if(r.type==='sep'){ host.appendChild(mk('div','sep')); return; }
    if(r.type==='label'){ host.appendChild(mk('div','seclabel',r.name)); return; }
    const d=mk('div','row'+(i===sel?' sel':''));
    if(['back','installall','uninstallall','apply','quit'].includes(r.type)) d.classList.add('action');
    if(r.type==='quit') d.classList.add('danger');
    if(r.feat) d.classList.add('feat');
    if(r.hook) d.classList.add('hook');
    if(r.folder) d.classList.add('folder');
    if(r.disabled) d.style.opacity=.4;
    if(r.type==='item'){
      d.appendChild(mk('span','caret', r.folder?'▾':(r.drill?'▸':' ')));
      d.appendChild(mk('span','glyph '+CLS[r.st], GLYPH[r.st]));
      d.appendChild(mk('span','name', r.name));
      d.appendChild(mk('span','tag', r.tag));
      d.appendChild(mk('span','stat', LABEL[r.st]));
      d.appendChild(mk('span','count', r.count!==undefined?r.count:''));
      const pe=mk('span','pend'); (r.pend||[]).forEach(x=>pe.appendChild(x)); d.appendChild(pe);
    } else { d.appendChild(mk('span','caret',' ')); d.appendChild(mk('span','glyph',' ')); d.appendChild(mk('span','name', r.name)); }
    d.addEventListener('click',()=>{ sel=i; activate(); });
    d.addEventListener('mousemove',()=>{ if(sel!==i){ sel=i; paintSel(); showDetail(); } });
    host.appendChild(d);
  });
  const pf=document.getElementById('pendfoot'); pf.textContent='';
  if(pendingCount()){ const L=Object.values(pending); pendNodes(L.filter(a=>a==='install').length,L.filter(a=>a==='uninstall').length).forEach(x=>pf.appendChild(x)); pf.appendChild(document.createTextNode(' staged')); }
  else { pf.appendChild(document.createTextNode('nothing staged')); }
  showDetail();
}
function paintSel(){ [...document.getElementById('rows').children].forEach((d,i)=>{ if(d.classList.contains('sep')||d.classList.contains('seclabel'))return; d.classList.toggle('sel', i===sel); }); }
function showDetail(){
  const r=rowsCache[sel], det=document.getElementById('detail'); det.textContent='';
  if(!r) return;
  if(r.type==='item'){ det.appendChild(mk('b',null,r.name)); det.appendChild(document.createTextNode('  '+(r.hint||'')));
    if(r.drill) det.appendChild(document.createTextNode('   (press → to open'+(r.folder?' the folder':'')+')'));
    else det.appendChild(document.createTextNode('   (press enter to '+(installed[r.path.join('/')]?'turn off':'turn on')+')')); }
  else det.appendChild(document.createTextNode(r.hint||''));
}
function toast(m){ const det=document.getElementById('detail'); det.textContent=''; det.appendChild(mk('b',null,m)); }

// ---- actions ----
function activate(){
  const r=rowsCache[sel]; if(!r||r.type==='sep'||r.type==='label') return;
  if(r.type==='item'){ if(r.drill){ nav=r.path.slice(); sel=0; } else toggleLeaf(r.path.join('/')); }
  else if(r.type==='back'){ nav=nav.slice(0,-1); sel=0; }
  else if(r.type==='installall'){ stageAll(nav,'install'); }
  else if(r.type==='uninstallall'){ stageAll(nav,'uninstall'); }
  else if(r.type==='apply'){ runApply(); return; }
  else if(r.type==='quit'){ doQuit(); return; }
  render();
}
function move(d){ const s=selectable(); if(!s.length)return; let p=s.indexOf(sel); if(p<0)p=0; p=(p+d+s.length)%s.length; sel=s[p]; paintSel(); showDetail(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){move(1);e.preventDefault();}
  else if(e.key==='ArrowUp'){move(-1);e.preventDefault();}
  else if(e.key==='Enter'||e.key==='ArrowRight'||e.key===' '){activate();e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='Escape'||e.key==='Backspace'){ if(nav.length){ nav=nav.slice(0,-1); sel=0; render(); } e.preventDefault(); }
  else if(e.key==='a'||e.key==='A'){ runApply(); }
  else if(e.key==='q'||e.key==='Q'){ doQuit(); }
});
boot();
</script>
</body>
</html>
