<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improv Setup</title>
<script>
  // Theme is resolved BEFORE first paint so the page never flashes the wrong
  // ground. Same pattern the marketing site uses: an inline script sets
  // data-theme, the toggle flips it and persists the choice.
  (function(){
    try{
      var t = localStorage.getItem('improv-setup-theme');
      if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

       header's own logo mark, verbatim - not a generic spinner - so a brief
       load still feels like part of the same product. Removed entirely once
       gone, not just hidden, so it can never block a click by accident. -->

      </svg>
    </span>
    <span class="topbar__sep" id="topsep" aria-hidden="true"></span>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
      <!-- source: lucide "moon" - path verbatim from lucide.dev -->
      <svg class="i-moon lucide-moon" data-icon-source="lucide:moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>

  </header>

  <div class="body">
    <div class="rail-col">
      <nav class="rail" id="rail" aria-label="Components"></nav>
      <!-- Pinned below the (scrolling) rail, not inside it - renderRail()
           clears and rebuilds #rail on every render(), which would wipe this
           out too if it lived there. -->
      <div class="shortcuts">
        <button class="shortcuts__trigger" id="shortcutsTrigger" type="button"
                aria-expanded="false" aria-controls="shortcutsPanel">
          <!-- source: lucide "info" - paths verbatim from lucide.dev -->
          <svg data-icon-source="lucide:info" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
          <span>Keyboard shortcuts</span>
        </button>
        <div class="shortcuts__panel" id="shortcutsPanel" role="dialog" aria-label="Keyboard shortcuts" hidden>
          <div class="shortcut__row"><span class="shortcut__keys"><kbd>&#8593;</kbd><kbd>&#8595;</kbd></span><span class="shortcut__desc">Move selection</span></div>
          <div class="shortcut__row"><span class="shortcut__keys"><kbd>Enter</kbd><kbd>&#8594;</kbd></span><span class="shortcut__desc">Open or toggle</span></div>
          <div class="shortcut__row"><span class="shortcut__keys"><kbd>&#8592;</kbd><kbd>Backspace</kbd></span><span class="shortcut__desc">Back</span></div>
          <div class="shortcut__row"><span class="shortcut__keys"><kbd>A</kbd></span><span class="shortcut__desc">Apply staged changes</span></div>
          <div class="shortcut__row"><span class="shortcut__keys"><kbd>Q</kbd></span><span class="shortcut__desc">Quit</span></div>
        </div>
      </div>
    </div>
    <main class="pane">
      <div class="pane__head">
        <!-- Back and the bulk actions get their own row, ABOVE the title -
             direct order. Both sides render into whichever is empty on a
             given page (a top-level bucket has bulk actions and no Back; a
             leaf self-row has neither), so the row hides itself entirely
             when there is nothing on either side. -->
        <div class="pane__toolbar" id="toolbar">
          <div class="pane__back" id="paneBack"></div>
          <div class="bulk" id="bulk"></div>
        </div>
        <!-- tabindex=-1: programmatic-focus-only, not a real Tab stop. Moving
             focus to the new view's own heading after navigation is the
             standard fix for the same class of bug refocusCheck() fixes for
             toggling - without it every navigation (rail, breadcrumb, back,
             drilling into a group) drops a keyboard/screen-reader user's
             focus to <body>, same as an untouched toggle used to. -->
        <span class="pane__eyebrow" id="paneEyebrow"></span>
        <h1 class="pane__title" id="paneTitle" tabindex="-1">Setup</h1>
        <p class="pane__desc" id="paneDesc"></p>
        <span class="pane__meta" id="paneMeta"></span>
      </div>
      <div class="rows" id="rows"></div>
    </main>
  </div>

  <footer class="actionbar">
    <!-- Anchored to the action bar rather than to the viewport, so it always sits
         directly above it whatever height the bar happens to be. -->
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <span class="staged" id="pendfoot"></span>
    <span class="keys"><kbd>&#8593;&#8595;</kbd> move <kbd>enter</kbd> toggle <kbd>&#8592;</kbd> back</span>
    <span class="actions">
      <button class="btn btn--primary" id="btnApply" type="button" disabled>Apply</button>
    </span>
  </footer>

<script>
// ---- server API (token-scoped; every request carries the page nonce) ----
const TOKEN = new URLSearchParams(location.search).get('token') || '';
function api(path, opts) {
  const u = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  return fetch(u, opts || {});
}

// ---- theme ----
const themeBtn = document.getElementById('themeToggle');
function syncThemeLabel(){
  const cur = document.documentElement.getAttribute('data-theme');
  themeBtn.setAttribute('aria-label', cur === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('improv-setup-theme', next); }catch(e){}
  syncThemeLabel();
});
syncThemeLabel();

// ---- tree + install state, populated from the live manifest ----
let T = {};
let HOOK_DESC = {};
let PINNED = new Set();
const installed = {}, pending = {};

function walkMembers(members, out) {
  for (const mem of members) {
    if (mem.kind === 'leaf') {
      out[mem.key] = { tag: mem.tag || '', desc: mem.desc || '' };
    } else if (mem.kind === 'hooks') {
      const kids = {};
      // Hooks carry the same explanations everything else does. They were the
      // one component type rendered with an empty description, which made the
      // most cryptic names on the whole list the least explained.
      for (const h of (mem.hooks || [])) kids[h] = { tag: '', desc: HOOK_DESC[h] || '' };
      out[mem.key] = { folder: 1, hooks: 1, tag: mem.tag || '', desc: mem.desc || '', children: kids };
    } else if (mem.members) {
      const kids = {};
      walkMembers(mem.members, kids);
      out[mem.key] = { tag: mem.tag || '', desc: mem.desc || '', children: kids };
    }
  }
}
function buildTreeFromManifest(m) {
  HOOK_DESC = m.hook_desc || {};
  PINNED = new Set(m.pinned_hooks || []);
  const tree = {};
  for (const b of m.buckets) {
    // A bucket with no members is itself a leaf (e.g. tilt-lab, lotus) so its
    // single state key stays reachable via leafPaths - do NOT give it children.
    // label is a DISPLAY override; the key underneath stays lowercase and
    // hyphenated because it is also the install path (pending/installed state,
    // --only flags) and must never change to avoid breaking that. Most buckets
    // have no override at all - their key already reads fine as a heading.
    const node = { tag: b.tag || '', desc: b.desc || '', intro: b.intro || '', label: b.label || '', featured: (b.section === 'core') };
    if (b.members && b.members.length) {
      node.children = {};
      walkMembers(b.members, node.children);
    }
    tree[b.key] = node;
  }
  T = tree;
  for (const k of Object.keys(installed)) delete installed[k];
  for (const [path, st] of Object.entries(m.state)) installed[path] = (st === 'active');
}

async function boot() {
  try {
    const m = await api('/manifest').then(r => r.json());
    buildTreeFromManifest(m);
    // nav starts empty and STAYS empty here - that is Home, the dashboard the
    // installer now opens to every time, not a stand-in for "no bucket picked
    // yet". Every bucket is reached by drilling in from it.
    render();
    // Pins everything render() just built at opacity:0 BEFORE the loader
    // starts fading - not after. The loader is opaque, but opacity is not
    // binary while it is transitioning: for the ~360ms it is fading, whatever
    // sits underneath shows straight through it. Content still at its normal
    // opacity (1) during that window means the real page is fully visible
    // through the "disappearing" loader before the reveal ever starts - seen
    // live: the loader visibly faded to reveal the finished page, THEN
    // everything flashed to invisible and stuttered back in via the stagger,
    // exactly backwards from "fade out showing nothing, then stagger in".
    revealTargets().forEach(el => el.classList.add('pre-reveal'));
  } catch (e) {
    // role="alert" only on the failure path - paneDesc changes on every
    // ordinary navigation too, and announcing every one of those would be
    // noise. A failed boot is the one time this text needs to interrupt
    // rather than wait to be read.
    const desc = document.getElementById('paneDesc');
    desc.setAttribute('role', 'alert');
    desc.textContent = 'Could not load the installer manifest: ' + e;
  }
  // Runs either way - a failed load still has to stop covering the (now
  // error-labeled) page, or it hangs there looking like loading never ends.
  hideLoader();
}
// Fades the boot loader out, then - only once it is actually gone, never
// while it is still fading on top - reveals everything real render() just
// built with a staggered entrance. On a timer rather than 'transitionend'
// for the same reason the toast removal below is: a dropped event would
// leave the loader sitting there forever instead of just finishing late.
function hideLoader(){
  const loader = document.getElementById('loader');
  if(!loader) return;
  loader.classList.add('is-out');
  setTimeout(() => { loader.remove(); revealContent(); }, 360);
}
// Same target list both times: pre-reveal hides them the instant they are
// built, revealContent() (below) is what actually lets them back in once the
// loader is gone. Row order already reads top-to-bottom, so index order and
// visual order are the same thing.
function revealTargets(){
  return [
    document.querySelector('.topbar'),
    document.getElementById('rail'),
    document.querySelector('.pane__head'),
    ...document.getElementById('rows').children,
    // Codex caught this one: without it, the Quit/Apply footer was never
    // hidden at all, so it sat at full opacity showing straight through the
    // loader's own fade - the exact bug this whole mechanism exists to avoid.
    document.querySelector('.actionbar'),
  ].filter(Boolean);
}
// One-shot, called only from hideLoader() - never from render() itself, so
// an ordinary navigation or toggle later never replays this. Each target
// gets its own --i so the animation-delay staggers it behind the one before.
function revealContent(){
  revealTargets().forEach((el, i) => {
    el.classList.remove('pre-reveal');
    el.style.setProperty('--i', i);
    el.classList.add('stagger-in');
  });
}

// ---- tree helpers ----
function nodeAt(path){ let n={children:T}; for(const s of path) n=n.children[s]; return n; }
// What a human reads, versus the key underneath - the one place that split
// matters. label exists only on the few top buckets whose install key is not
// already a fine heading (sidecoach, justify, tilt-lab, lotus); everything
// else falls back to its own key, unchanged.
function labelFor(path){ const n=nodeAt(path); return (n && n.label) || path[path.length-1]; }
function isLeaf(n){ return !n.children; }
function leafPaths(path){ const n=nodeAt(path); if(isLeaf(n)) return [path.join('/')];
  return Object.keys(n.children).flatMap(k=>leafPaths(path.concat(k))); }
// Pinned hooks (project-scoped, always-on) are excluded from --apply-plan's own
// allowlist - install.sh rejects the whole plan if one slips in. Mirrors the same
// two-part test install.sh uses: the key is a pinned hook name AND its parent is
// actually a hooks folder, not some unrelated leaf that happens to share a name.
function isPinnedLeaf(joined){
  const segs = joined.split('/');
  if (segs.length < 2 || !PINNED.has(segs[segs.length-1])) return false;
  const parent = nodeAt(segs.slice(0,-1));
  return !!(parent && parent.hooks);
}

// ---- state ----
const GLYPH={active:'●',partial:'◐',none:'○'}, CLS={active:'g-active',partial:'g-partial',none:'g-none'};
const LABEL={active:'installed',partial:'partial',none:'not installed'};
const STATCLS={active:'is-on',partial:'is-part',none:''};
function counts(path){ const L=leafPaths(path); return {on:L.filter(p=>installed[p]).length,total:L.length}; }
function stateOf(path){ const n=nodeAt(path); if(isLeaf(n)) return installed[path.join('/')]?'active':'none';
  const c=counts(path); return c.on===0?'none':(c.on===c.total?'active':'partial'); }
// Matches the terminal browser exactly: a pinned leaf's own row is not
// toggleable at all (a toast says why, nothing is staged), and a bulk action
// quietly leaves pinned leaves out of the batch rather than failing the whole
// Apply on them later.
function toggleLeaf(p){
  if (isPinnedLeaf(p)) { toast(p.split('/').pop() + ' is always on - it is project-scoped and cannot be toggled here.', 'info'); return; }
  const t=installed[p]?'uninstall':'install'; if(pending[p]===t) delete pending[p]; else pending[p]=t;
}
function stageAll(path,a){ leafPaths(path).forEach(p=>{ if(isPinnedLeaf(p)) return; const want=a==='install'; if(installed[p]===want) delete pending[p]; else pending[p]=a; }); }
// Projected state: what will be true after Apply, which is what a checked box
// claims. A staged change wins over the current disk state; anything unstaged
// keeps it.
function willBeOn(p){ return pending[p] ? pending[p]==='install' : !!installed[p]; }
function willAllBeOn(path){ const L=leafPaths(path); return L.length>0 && L.every(willBeOn); }
function pendUnder(path){ const L=leafPaths(path); return {ins:L.filter(p=>pending[p]==='install').length, un:L.filter(p=>pending[p]==='uninstall').length}; }
function pendingCount(){ return Object.keys(pending).length; }

// ---- apply: stream the real install log, then refresh state from the server ----
function stagedPlan() {
  const install = [], uninstall = [];
  for (const [p, a] of Object.entries(pending)) (a === 'install' ? install : uninstall).push(p);
  return { install, uninstall };
}
// The installer speaks shell. Nobody reading a setup screen should have to.
// Each rule turns one line of that output into a sentence about what happened
// and what it means for them. Order matters: first match wins.
const nameOf = s => String(s).split('/').pop().replace(/,/g, ', ');
const APPLY_RULES = [
  { re: /INVARIANT VIOLATION/,
    kind: 'error',
    say: () => 'The installer refused this plan because one component was listed to be both added and removed. Nothing was changed.' },
  { re: /could not create the install log in (.+?) - nothing was applied/,
    kind: 'error',
    say: m => `The installer could not write its temporary files to ${m[1]}, so nothing was changed. Check that the folder exists and the disk is not full.` },
  { re: /install pass FAILED \(exit \d+\) for --only (.+)/,
    kind: 'error',
    say: m => `Adding ${nameOf(m[1])} failed, so nothing was removed either.` },
  { re: /deactivate FAILED \(exit \d+\) for component (\S+)/,
    kind: 'error',
    say: m => `Removing ${nameOf(m[1])} failed.` },
  { re: /WARNING - (\S+) was deactivated but recording its inactive state FAILED/,
    kind: 'info',
    say: m => `${nameOf(m[1])} was removed, but the installer could not update its own record of it. Reopen the installer if the list looks out of date.` },
  { re: /the pull did not happen/,
    kind: 'error',
    say: () => 'Could not download the latest version, so nothing was re-installed. Check your network, or resolve the repository by hand.' },
];

let applying = false;
async function runApply() {
  if (applying) return;                                     // guard: never fire /apply twice concurrently
  if (pendingCount() === 0) { toast('Nothing staged to apply.','info'); return; }
  applying = true;
  const plan = stagedPlan();                                // snapshot the exact plan we post
  const n = plan.install.length + plan.uninstall.length;
  // The only toast the code ever closes on your behalf, because it describes
  // something in progress and stops being true the moment the run ends.
  const working = toast(n === 1 ? 'Applying one change...' : `Applying ${n} changes...`, 'info');
  let out = '', buf = '', explained = 0;
  const unexplained = [];                                   // kept so a failure is never silent
  // Translate whole lines only - a chunk boundary can split one in half.
  const feed = chunk => {
    buf += chunk;
    const lines = buf.split('\n'); buf = lines.pop();
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || /^All changes applied successfully\.$/.test(line)) continue;
      const rule = APPLY_RULES.find(r => r.re.test(line));
      if (rule) { toast(rule.say(line.match(rule.re)), rule.kind); explained++; }
      else unexplained.push(line);
    }
  };
  try {
    const res = await api('/apply', { method:'POST', body: JSON.stringify(plan) });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      const c = dec.decode(value, { stream:true }); out += c; feed(c);
    }
    const tail = dec.decode(); out += tail; feed(tail + '\n');   // flush trailing multibyte bytes
    const m = await api('/manifest').then(r => r.json());        // refresh REAL state either way
    buildTreeFromManifest(m);
    // Only treat the apply as done - and clear the staged plan - if the installer
    // reported success. apply_pending is fail-loud (a rejected/pinned/failed plan
    // ends non-zero), and clearing pending regardless would silently drop the
    // user's staged changes. This string is written by server.py's closing line;
    // the two must change together.
    const ok = res.ok && /All changes applied successfully\.\s*$/.test(out);
    working();
    render();
    if (ok) {
      for (const p of plan.install.concat(plan.uninstall)) delete pending[p];   // clear only a clean apply
      render();
      toast(n === 1 ? 'One change applied.' : `All ${n} changes applied.`, 'success');
    } else {
      toast('Nothing was applied and nothing was discarded - your selection is still staged.', 'error');
      // A failure this code has no sentence for must still reach the user. Better
      // one raw line they can quote than a reassuring message hiding it.
      if (!explained && unexplained.length) {
        toast('The installer said: ' + unexplained[unexplained.length - 1], 'error');
      }
    }
  } catch (e) {
    working();
    toast('Lost contact with the installer. Your selection is still staged.', 'error');
  } finally {
    applying = false;
  }
}
function doQuit() {
  api('/shutdown', { method:'POST', body:'{}' }).catch(()=>{});
  render(); toast('Installer stopped. You can close this tab.','info');
}

// ---- dom ----
function mk(tag,cls,text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }

// ---- navigation: nav[0] is the RAIL selection, deeper entries drill in -------
let nav=[], sel=0, rowsCache=[];
// Paths copied byte-for-byte from the local lucide checkout, icons/square-check.svg
// and icons/square.svg. The data-icon-source marker is what makes that checkable.
const BOX_ON  = '<svg data-icon-source="lucide:square-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="m9 12 2 2 4-4" /></svg>';
const BOX_OFF = '<svg data-icon-source="lucide:square" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /></svg>';
// A generative shape, not an icon - a plain traced rectangle, not iconography,
// so it carries no data-icon-source. rx and ry canNOT both be percentages here:
// SVG resolves an rx percentage against the rect's WIDTH and an ry percentage
// against its HEIGHT independently, and on a pill far wider than it is tall
// that clamps the two corners to wildly different radii - the first attempt
// at this drew a lopsided arc bunched at one end rather than a capsule. The
// badge's height is a fixed 19px across every instance (padding and font-size
// never vary, only the text width does), so rx and ry are the SAME absolute
// value here - half that height - which is what actually produces a stadium
// shape regardless of how wide the text makes the pill. The rect sits at the
// box edge (x/y:0, 100% width/height) rather than inset, so the stroke draws
// centred ON the badge's own border line - the same place a real border sits
// - instead of reading as a ring floating inside it.
// width/height:100% as real XML attributes, not just the CSS class - a plain
// CSS override of an <svg>'s intrinsic size does not reliably establish the
// viewport the child rect's OWN percentages resolve against. Without them the
// rect measured itself against the default 300x150 intrinsic box instead of
// the badge's real ~104x19, so it only drew the piece of a much larger,
// mostly off-canvas curve that happened to intersect the visible pill.
const ANTS_RING = '<svg class="ants-ring" width="100%" height="100%" aria-hidden="true" focusable="false"><rect style="x:0;y:0;width:100%;height:100%;rx:9.5px;ry:9.5px;" /></svg>';
const CHEV = '<svg data-icon-source="lucide:chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
// The row's-end echo of the badge's own on/off - a circle rather than the
// badge's square-check, so it reads as a second SHAPE, not a second copy of
// the same glyph.
const DOT_ON  = '<svg data-icon-source="lucide:circle-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>';
const DOT_OFF = '<svg data-icon-source="lucide:circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /></svg>';
// Which way the next render moved through the tree, so the pane can say so.
let navDir='';

function renderRail(){
  const rail=document.getElementById('rail'); rail.textContent='';
  // Home sits above both sections, not inside either - it is the dashboard
  // every other page here is a child of, not one more bucket among them.
  const home=mk('button','rail__item'); home.type='button';
  if(!nav.length) home.setAttribute('aria-current','true');
  home.appendChild(mk('span','rail__name','Home'));
  home.addEventListener('click',()=>{ navDir='lateral'; nav=[]; sel=0; render(); focusPaneTitle(); });
  rail.appendChild(home);
  for(const [label,pred] of [['The suite',k=>T[k].featured],['Add-ons',k=>!T[k].featured]]){
    const keys=Object.keys(T).filter(pred);
    if(!keys.length) continue;
    rail.appendChild(mk('div','rail__label',label));
    for(const k of keys){
      const st=stateOf([k]), c=counts([k]);
      const b=mk('button','rail__item'); b.type='button';
      if(nav[0]===k) b.setAttribute('aria-current','true');
      // No control here: a rail row navigates, it does not toggle. Progress is
      // carried by the count below, and by the current-item highlight.
      b.appendChild(mk('span','rail__name', labelFor([k])));
      // Amber is reserved for a group that still needs attention - showing
      // every count now, but only an incomplete one gets the coloured class,
      // so the eye still lands on what is unfinished rather than everything.
      b.appendChild(mk('span','rail__count'+(c.on<c.total?' is-part':''), c.on+'/'+c.total));
      // Lateral: switching between siblings is not forward or backward, so the
      // cue is a fade rather than the slide those get - direct order, in place
      // of the "instant" swap this used to be.
      b.addEventListener('click',()=>{ navDir='lateral'; nav=[k]; sel=0; render(); focusPaneTitle(); });
      rail.appendChild(b);
    }
  }
}

function renderCrumb(){
  const c=document.getElementById('crumb'); c.textContent='';
  // Nothing to retrace ON Home itself - the trail appears once you have
  // actually gone somewhere, starting from the bucket it opened from.
  const sep=document.getElementById('topsep');
  if(nav.length<1){ if(sep) sep.style.display='none'; return; }
  if(sep) sep.style.display='';
  const home=mk('button',null,'Home'); home.type='button';
  home.addEventListener('click',()=>{ navDir='back'; nav=[]; sel=0; render(); focusPaneTitle(); });
  c.appendChild(home);
  nav.forEach((seg,i)=>{
    c.appendChild(mk('span','chev','›'));
    const text = labelFor(nav.slice(0,i+1));
    if(i===nav.length-1){ c.appendChild(mk('b',null,text)); }
    else { const b=mk('button',null,text); b.type='button';
      b.addEventListener('click',()=>{ navDir='back'; nav=nav.slice(0,i+1); sel=0; render(); focusPaneTitle(); }); c.appendChild(b); }
  });
}

function render(){
  renderRail(); renderCrumb();
  // nodeAt([]) already resolves to {children:T} - the whole tree as one
  // node - so Home needs no separate branch here: it is simply the node one
  // level above every bucket, exactly like any other group is one level
  // above its own children.
  const n = nodeAt(nav);
  const paneTitle = document.getElementById('paneTitle');
  paneTitle.textContent = nav.length ? labelFor(nav) : 'Improv';
  paneTitle.classList.toggle('is-home', !nav.length);
  // The eyebrow only ever says one thing, and only above the one title it
  // introduces - every other page's title stands on its own the way it always
  // has.

  // The pane header is what this thing IS; the row below it is what installing
  // it DOES. For a group those are naturally two different pieces of text
  // (Beats' own blurb vs "memory"'s row). A single-component bucket has only
  // one piece of data unless intro exists, so intro wins here when present -
  // it is what stops the header from just echoing the row underneath it. Home
  // has no desc of its own (T is the tree, not a node with a desc field), so
  // it gets a welcome line instead - what this is and how to use it, not a
  // number the rail already shows per bucket.
  document.getElementById('paneDesc').textContent = nav.length
    ? (n.intro || n.desc || n.tag || '')
    : "Improv is the Yes& Claude Code stack - discipline, memory, design, and workflow tooling for Claude Code, organized into the buckets below. Open one to see what is inside, use the badge on any row to stage it for install or removal, then press Apply when you are ready to make it real.";
  const meta=document.getElementById('paneMeta');
  // The rail already carries the count for every group, scannable side by side.
  // Repeating it here was the same fact in a second place.
  meta.textContent = '';

  // Bulk actions and Back share a row above the title now, one on each side,
  // rather than sitting together in a single right-aligned group. Rebuilt on
  // every render() the same as the row list, so both refocus what was just
  // pressed for the same reason refocusCheck() does.
  const bulk=document.getElementById('bulk'); bulk.textContent='';
  if(n && !isLeaf(n)){
    const inHooks=!!n.hooks;
    const bi=mk('button','btn', inHooks?'Enable all':'Install all'); bi.type='button';
    bi.addEventListener('click',()=>{ stageAll(nav,'install'); render();
      const b=document.querySelector('#bulk .btn:not(.btn--danger)'); if(b) b.focus(); });
    const bu=mk('button','btn btn--danger', inHooks?'Disable all':'Remove all'); bu.type='button';
    bu.addEventListener('click',()=>{ stageAll(nav,'uninstall'); render();
      const b=document.querySelector('#bulk .btn--danger'); if(b) b.focus(); });
    bulk.appendChild(bi); bulk.appendChild(bu);
  }
  const paneBack=document.getElementById('paneBack'); paneBack.textContent='';

  // included, so Back shows anywhere nav has actually gone somewhere. Home

  if(nav.length>0){
    const bb=mk('button','btn btn--quiet','‹ Back'); bb.type='button';
    bb.addEventListener('click',()=>{ navDir='back'; nav=nav.slice(0,-1); sel=0; render(); focusPaneTitle(); });
    paneBack.appendChild(bb);
  }

  // with no bulk actions and no Back) - the row disappears rather than
  // sitting there as empty space above the title.
  document.getElementById('toolbar').style.display =
    (bulk.children.length || paneBack.children.length) ? '' : 'none';

  // A leaf you have DRILLED INTO (tilt-lab, lotus) used to have no control at
  // all here - the rail carries navigation only, not toggles, since the
  // switch-that-lies fix - so its own text was pointing at a control that did
  // not exist. It renders as a single-row list of itself instead, reusing the
  // exact badge/checkbox the child rows use everywhere else.
  // At Home, n.children IS T - the bucket list - so this same line that lists
  // any group's children lists every top-level bucket with no separate path.
  rowsCache = isLeaf(n) ? [nav.slice()] : Object.keys(n.children).map(k=>nav.concat(k));
  const host=document.getElementById('rows'); host.textContent='';
  if(!rowsCache.length){
    host.appendChild(mk('div','empty','Nothing to configure here.'));
  }
  if(sel>=rowsCache.length) sel=Math.max(0,rowsCache.length-1);
  rowsCache.forEach((path,i)=>{
    const node=nodeAt(path), st=stateOf(path), leaf=isLeaf(node);
    const disp = labelFor(path);
    const c=counts(path);
    const d=mk('div','row'+(i===sel?' sel':''));
    d.appendChild(mk('span','row__name', disp));

    // THE BADGE IS THE CONTROL. It reads the state AND it is what you press to
    // change it, so there is one thing on the row to look at and one thing to
    // operate. A checked box means "this will be on the machine after Apply" -
    // which is why a staged install reads as checked before anything has run.
    const leafKey = leaf ? path.join('/') : '';
    const pinned = leaf && isPinnedLeaf(leafKey);
    const stagedAct = leaf ? (pending[leafKey]||'') : '';
    const und = leaf ? {ins:0,un:0} : pendUnder(path);
    let bcls, btext, on;

    // rather than letting the row read like an ordinary install anyone can flip.
    if(pinned){

    } else if(stagedAct){
      bcls = 'is-staged ' + (stagedAct==='install' ? 'will-install' : 'will-remove');
      btext = stagedAct==='install' ? 'will install' : 'will remove';
      on = stagedAct==='install';
    } else if(leaf){
      bcls = st==='active' ? 'is-on' : 'is-off';
      btext = st==='active' ? 'installed' : 'not installed';
      on = st==='active';
    } else if(und.ins||und.un){
      bcls='is-staged '+(und.ins?'will-install':'will-remove');
      btext=(und.ins?'+'+und.ins:'')+(und.ins&&und.un?' ':'')+(und.un?'−'+und.un:'')+' staged';
      // The box asks "will EVERY child be installed after Apply", not "is there
      // an install staged". A group staging one install and one removal is still
      // partial afterwards, so it must not read as checked.
      on = willAllBeOn(path);
    }
    else if(st==='active'){ bcls='is-on'; btext=c.total+'/'+c.total; on=true; }
    else if(st==='none'){ bcls='is-off'; btext='0/'+c.total; on=false; }
    else { bcls='is-part'; btext=c.on+'/'+c.total; on=false; }

    const chk=mk('button','check '+bcls+(on?' is-checked':'')); chk.type='button';
    chk.setAttribute('aria-pressed', on?'true':'false');
    chk.setAttribute('aria-label', pinned
      ? disp+' is always on and cannot be toggled here'
      : (on?'Deselect ':'Select ')+disp+' for install');

    // Anything staged - not yet applied, either direction - gets the moving
    // ring. It is a currentColor stroke, so it reads green on will-install and
    // red on will-remove automatically, matching whichever this badge is.
    if(bcls.indexOf('is-staged')>-1) chk.insertAdjacentHTML('beforeend', ANTS_RING);
    chk.appendChild(mk('span','check__t', btext));
    // Pressing the box on a GROUP acts on everything under it, which is the
    // same bulk action the section header offers, reached from the group itself.
    const toggle=()=>{ sel=i;
      if(leaf) toggleLeaf(path.join('/')); else stageAll(path, on?'uninstall':'install');

    chk.addEventListener('click',e=>{ e.stopPropagation(); toggle(); });

    // explicitly and suppress both the native activation and the global key
    // handler, so it fires exactly once and never falls through to navigation.
    chk.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); toggle(); }
    });
    d.appendChild(chk);

    // A row that OPENS says so. Nothing previously distinguished a row that
    // toggles from a row that navigates - and for a keyboard or screen-reader
    // user, the row itself (a plain div) was never reachable at all: Tab only
    // ever visited the check button, which stages a bulk install, so there was
    // NO way to actually drill into a group without a mouse. The chevron
    // becomes a real, separately-focusable button for exactly that action,
    // rather than nesting it inside the check button (two controls stacked
    // in one element is invalid and no more reachable than none at all).
    const go=mk(leaf?'span':'button','row__go');
    if(leaf){
      // A second, purely visual echo of the SAME `on` the badge already
      // reads - not a second control. The row's own click/Enter handling is
      // untouched; this never gets a handler of its own, and aria-hidden
      // keeps a screen reader from meeting it as if it were one. Redundant by
      // design: a circle at the row's end answers "is this a toggle, and
      // which way" at a glance, the same fact the badge states in words.
      go.classList.add('row__dot', on?'is-on':'is-off');
      go.setAttribute('aria-hidden','true');
      go.innerHTML = on ? DOT_ON : DOT_OFF;

      // A row that OPENS says so. Nothing previously distinguished a row that
      // toggles from a row that navigates - and for a keyboard or screen-reader
      // user, the row itself (a plain div) was never reachable at all: Tab only
      // ever visited the check button, which stages a bulk install, so there was
      // NO way to actually drill into a group without a mouse. The chevron
      // becomes a real, separately-focusable button for exactly that action,
      // rather than nesting it inside the check button (two controls stacked
      // in one element is invalid and no more reachable than none at all).
      go.innerHTML = CHEV;
      go.type='button';
      go.setAttribute('aria-label','Open '+disp);
      go.addEventListener('click',e=>{ e.stopPropagation();
        sel=i; navDir='fwd'; nav=path.slice(); sel=0; render(); focusPaneTitle(); });
    }
    d.appendChild(go);

    // The description gets its own line rather than an ellipsis. These run to
    // two sentences, and a truncated explanation explains nothing.
    const dsc=node.desc || node.tag || '';
    if(dsc) d.appendChild(mk('span','row__desc', dsc));
    d.addEventListener('click',()=>{ sel=i; activate(); });
    d.addEventListener('mouseenter',()=>{ sel=i; paintSel(); });
    host.appendChild(d);
  });

  const pf=document.getElementById('pendfoot'); pf.textContent='';
  const nP=pendingCount();
  if(nP){ const L=Object.values(pending);
    const ins=L.filter(a=>a==='install').length, un=L.filter(a=>a==='uninstall').length;
    if(ins) pf.appendChild(mk('span','plus','+'+ins));
    if(un){ if(ins) pf.appendChild(document.createTextNode(' ')); pf.appendChild(mk('span','minus','−'+un)); }
    pf.appendChild(document.createTextNode(' staged'));
  }   // no staged changes -> the bar says nothing at all
  const ap=document.getElementById('btnApply');
  ap.disabled = nP===0;
  ap.textContent = nP ? ('Apply '+nP+' change'+(nP===1?'':'s')) : 'Apply';
  // Play the direction cue, then clear it so a re-render for an unrelated reason
  // (staging a change, applying) does not slide the pane sideways for no reason.
  if(navDir){
    const pane=document.querySelector('.pane');
    pane.classList.remove('is-fwd','is-back','is-lateral');
    void pane.offsetWidth;                       // restart the animation
    pane.classList.add(navDir==='fwd' ? 'is-fwd' : navDir==='back' ? 'is-back' : 'is-lateral');
    navDir='';
  }
}
function paintSel(){ [...document.getElementById('rows').children].forEach((d,i)=>{ if(d.classList) d.classList.toggle('sel', i===sel); }); }
// render() wipes and rebuilds #rows on every toggle, which destroys whatever
// had focus - a keyboard user pressing Enter on a checkbox otherwise loses
// their place and lands on <body>, forced to re-Tab from the top of the page
// to do anything else. Toggling never changes the row count or order, so the
// SAME index after the rebuild is still the same logical row; refocusing it
// there is what keeps a keyboard user's position across their own action.
function refocusCheck(i){
  const row = document.getElementById('rows').children[i];
  const c = row && row.querySelector('.check');
  if(c) c.focus();
}
// Same problem, the navigation version: rail clicks, breadcrumb clicks, the
// back button and drilling into a group all replace the ENTIRE pane, not just
// the row list - focusing the new heading is the standard fix for a route
// change, and announces where you landed to a screen reader in the process.
function focusPaneTitle(){ const h=document.getElementById('paneTitle'); if(h) h.focus(); }
// STATUS SPEAKS IN ONE PLACE, AND STAYS PUT. This used to write into a span in
// the action bar that the next row hover overwrote, so a message about a failed
// apply could disappear before it had been read. A toast owns its own lifetime.
const T_ICON = {
  success: '<svg data-icon-source="lucide:circle-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>',
  error:   '<svg data-icon-source="lucide:circle-alert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>',
  info:    '<svg data-icon-source="lucide:info" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>'
};
const T_X = '<svg data-icon-source="lucide:x" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>';

function toast(m, kind){

  // the ones already on screen slide up as this one arrives - they are being
  // pushed by a row that is growing, rather than jumping to a new position.
  const slot = mk('div','t-slot');
  const t = mk('div','toast toast--'+kind);
  // An error interrupts; anything else is announced politely when the reader is free.
  t.setAttribute('role', kind==='error' ? 'alert' : 'status');
  const ic = mk('span','toast__icon'); ic.innerHTML = T_ICON[kind]; t.appendChild(ic);
  t.appendChild(mk('span','toast__msg', m));

    if (gone) return; gone = true;

    // rather than leaving a hole.
    slot.classList.add('is-out');
    // Removal is on a timer, never on transitionend: a dropped event would leave
    // the toast on screen for the rest of the session.
    setTimeout(() => slot.remove(), 240);
  };
  x.addEventListener('click', close);
  // NOTHING CLOSES ITSELF. A message about what happened to your machine waits
  // until you have read it and dismissed it. The single exception is a progress
  // toast, which the caller retires when the work finishes - leaving "Applying
  // ..." on screen after it has stopped applying would be a lie, not patience.
  return close;
}

function activate(){
  const path=rowsCache[sel]; if(!path) return;
  const i=sel;
  if(isLeaf(nodeAt(path))){ toggleLeaf(path.join('/')); render(); refocusCheck(i); }
  else { navDir='fwd'; nav=path.slice(); sel=0; render(); focusPaneTitle(); }   // going deeper
}
function move(d){ if(!rowsCache.length) return; sel=(sel+d+rowsCache.length)%rowsCache.length; paintSel(); }

document.getElementById('btnApply').addEventListener('click', runApply);
document.getElementById('btnQuit').addEventListener('click', doQuit);

// ---- keyboard shortcuts panel: a simple toggle, not a full popover library.
// Floats above its own trigger (see .shortcuts__panel), closes on a second
// click of the trigger, a click anywhere outside it, or Escape.
const shortcutsTrigger = document.getElementById('shortcutsTrigger');
const shortcutsPanel = document.getElementById('shortcutsPanel');
// Matches .shortcuts__panel's own transition duration in styles.css - keep
// the two in sync if either changes.
const SHORTCUTS_ANIM_MS = 180;
function setShortcutsOpen(open){
  shortcutsTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open){
    shortcutsPanel.hidden = false;
    // Forces the browser to register the closed (opacity:0, translateY(8px))
    // state as a real paint before adding .is-open - otherwise removing
    // [hidden] and adding .is-open happen in the same frame and there is
    // nothing for the transition to animate FROM.
    void shortcutsPanel.offsetWidth;
    shortcutsPanel.classList.add('is-open');
  } else {
    shortcutsPanel.classList.remove('is-open');
    // On a timer, not 'transitionend' - same reason as hideLoader(): a
    // dropped event would leave the panel sitting there, invisible but still
    // exposed to focus and screen readers, forever.
    setTimeout(()=>{
      if(!shortcutsPanel.classList.contains('is-open')) shortcutsPanel.hidden = true;
    }, SHORTCUTS_ANIM_MS);
  }
}
shortcutsTrigger.addEventListener('click', e=>{
  e.stopPropagation();
  setShortcutsOpen(shortcutsPanel.hidden);
});
document.addEventListener('click', e=>{
  if(!shortcutsPanel.hidden && !e.target.closest('.shortcuts')) setShortcutsOpen(false);
});
document.addEventListener('keydown',e=>{
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='ArrowDown'){move(1);e.preventDefault();}
  else if(e.key==='ArrowUp'){move(-1);e.preventDefault();}
  else if(e.key==='Enter'||e.key==='ArrowRight'){
    // Let a focused control do its own job rather than hijacking the key. This
    // used to name specific regions, which missed the row badge - tabbing to one
    // and pressing Enter both toggled it AND drilled into the group.
    if(document.activeElement && document.activeElement.tagName==='BUTTON') return;
    activate(); e.preventDefault();
  }
  else if(e.key==='ArrowLeft'||e.key==='Backspace'){ if(nav.length>0){ navDir='back'; nav=nav.slice(0,-1); sel=0; render(); focusPaneTitle(); } e.preventDefault(); }
  else if(e.key==='a'||e.key==='A'){ runApply(); }
  else if(e.key==='q'||e.key==='Q'){ doQuit(); }
  else if(e.key==='Escape' && !shortcutsPanel.hidden){ setShortcutsOpen(false); shortcutsTrigger.focus(); }
});
boot();
</script>
</body>
</html>
