<!doctype html><html><head><meta charset="utf-8"><title>Underline</title>
<style>
  .link { position: relative; }
  .link::after { content:""; transform: scaleX(0); transform-origin: left; transition: transform 200ms ease; }
  .link:hover::after { transform: scaleX(1); }
  .logo { transform: scale(1); }
</style></head>
<body><a class="link">Docs</a><span class="logo">yes&</span></body></html>
