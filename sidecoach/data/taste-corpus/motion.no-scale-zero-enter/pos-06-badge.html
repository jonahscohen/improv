<!doctype html><html><head><meta charset="utf-8"><title>Badge</title>
<style>
  .badge { display:inline-grid; place-items:center; }
  .badge--pop { transform: scale(0.0); animation: pop 200ms ease forwards; }
  @keyframes pop { to { transform: scale(1); } }
</style></head>
<body><span class="badge badge--pop">3</span></body></html>
