<!doctype html><html><head><meta charset="utf-8"><title>Toast</title>
<style>
  .toast { position: fixed; bottom: 24px; right: 24px; }
  .toast--enter { transform: scale(0); transition: transform 180ms ease-out; }
  .toast--shown { transform: scale(1); }
</style></head>
<body><div class="toast toast--enter">Saved</div></body></html>
