<!doctype html><!-- NEGATIVE: a blink keyframe used FINITELY (2 iterations), not an endless blink. Must not fire. -->
<html lang="en"><head><meta charset="utf-8"><title>Once</title>
<style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .c{animation:blink .5s steps(1) 2}</style></head>
<body style="font-family:monospace;padding:40px">
<span class="c">!</span>
</body></html>
