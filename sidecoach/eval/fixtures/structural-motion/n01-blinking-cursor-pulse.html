<!doctype html><!-- NEGATIVE: a breathing PULSE (opacity 0.5<->1), not an on/off blink. Must not fire. -->
<html lang="en"><head><meta charset="utf-8"><title>Pulse</title>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}} .dot{width:12px;height:12px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite}</style></head>
<body style="font-family:Inter,system-ui,sans-serif;padding:40px">
<div class="dot"></div>
</body></html>
