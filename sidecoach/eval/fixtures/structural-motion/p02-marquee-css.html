<!doctype html><!-- POSITIVE: a CSS marquee - an infinite keyframe animation translating content horizontally by 100%. -->
<html lang="en"><head><meta charset="utf-8"><title>Ticker</title>
<style>@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}} .ticker{animation:scroll 12s linear infinite;white-space:nowrap}</style></head>
<body style="font-family:Inter,system-ui,sans-serif;padding:40px;overflow:hidden">
<div class="ticker">Logos and headlines scrolling forever across the page, over and over.</div>
</body></html>
