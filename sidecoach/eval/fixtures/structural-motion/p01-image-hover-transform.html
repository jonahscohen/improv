<!doctype html><!-- POSITIVE: a :hover rule that scales an image (hover zoom). -->
<html lang="en"><head><meta charset="utf-8"><title>Gallery</title>
<style>.card img{transition:transform .3s} .card:hover img{transform:scale(1.06)}</style></head>
<body style="font-family:Inter,system-ui,sans-serif;padding:40px">
<div class="card"><img src="a.jpg" alt="" width="240" height="160"></div>
</body></html>
