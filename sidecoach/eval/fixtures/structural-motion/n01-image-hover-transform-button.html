<!doctype html><!-- NEGATIVE: a :hover transform on a BUTTON (not an image). The class targets image hover transforms only. -->
<html lang="en"><head><meta charset="utf-8"><title>Button</title>
<style>.btn{transition:transform .2s} .btn:hover{transform:scale(1.05)}</style></head>
<body style="font-family:Inter,system-ui,sans-serif;padding:40px">
<button class="btn">Get started</button>
</body></html>
