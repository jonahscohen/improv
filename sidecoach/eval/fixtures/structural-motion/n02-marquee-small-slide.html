<!doctype html><!-- NEGATIVE: an infinite but SMALL horizontal nudge (8px) - a subtle idle motion, not a scrolling marquee. -->
<html lang="en"><head><meta charset="utf-8"><title>Nudge</title>
<style>@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}} .n{animation:nudge 2s ease-in-out infinite}</style></head>
<body style="font-family:Inter,system-ui,sans-serif;padding:40px">
<div class="n">A small arrow that nudges.</div>
</body></html>
