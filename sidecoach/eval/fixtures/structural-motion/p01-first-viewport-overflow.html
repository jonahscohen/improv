<!doctype html><!-- POSITIVE: a 100vh top hero with overflow:hidden whose content is taller than the viewport, so it clips in the first screen. -->
<html lang="en"><head><meta charset="utf-8"><title>Hero</title></head>
<body style="margin:0;font-family:Inter,system-ui,sans-serif">
<section style="height:100vh;overflow:hidden;padding:24px;box-sizing:border-box">
<div style="height:1200px">
<h1 style="font-size:40px">Everything, on one screen</h1>
<p style="max-width:640px">This hero is locked to the viewport height but its content runs far past the fold, so the bottom is clipped away in the first screen the visitor sees.</p>
</div></section>
</body></html>
